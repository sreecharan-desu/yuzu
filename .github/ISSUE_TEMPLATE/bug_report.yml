name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File type and option
      placeholder: e.g. HEIC to WebP, or Trim on an MKV file
  - type: input
    id: yuzu
    attributes:
      label: Yuzu version
      description: Settings > About
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.2"
    validations:
      required: true
  - type: textarea
    id: helpers
    attributes:
      label: Helpers installed
      description: Which of ffmpeg, cwebp, exiftool and LibreOffice are installed (Settings > About)?
